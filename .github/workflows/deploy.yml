# main に push すると自動でビルドして GitHub Pages に公開する。
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # 毎週月曜 6:00（日本時間）に作り直し、流れる帯の GDP を世界銀行の最新値に更新する
  schedule:
    - cron: '0 21 * * 0'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
